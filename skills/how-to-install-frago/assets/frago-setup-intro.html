<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frago — 装之前先问你几件事</title>

<!-- 这是模板,不是成品。skill 里的 setup-page.sh / setup-page.ps1 探测完机器,把结果嵌进脚本开头
     那个空位,生成出来的才是给人看的页面。模板自己不含任何一台机器的状态:空位没填时,
     页面只显示一句「要由 skill 生成后打开」。
     页面不是安装进度,是安装前的问卷:每一屏收一个决定,只讲拿这个决定需要知道的事。
     中英双语,按浏览器语言默认,右上角可切;每屏一个地址 #1…#5。
     视觉体系照 frago_welcome 配方那张页来。样式、脚本、logo 全部内联,一个文件,不联网。 -->
<style>
:root {
  --bg: #07090d;
  --bg-2: #0d1117;
  --ink: #f2f4f8;
  --ink-mid: #b9c0cd;
  --ink-dim: #7c8598;
  --line: #1e242e;
  --line-soft: #161b23;
  --card: #10151d;
  --accent: #35c97e;
  --accent-dim: #1d7d4e;
  --accent-soft: rgba(53, 201, 126, .12);
  --warm: #f0b429;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1100px 620px at 50% -18%, rgba(53, 201, 126, .13), transparent 62%),
    radial-gradient(760px 460px at 88% 108%, rgba(53, 201, 126, .07), transparent 60%),
    var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
code, .mono { font-family: var(--mono); }

/* ---------- 舞台 ---------- */

.stage { height: 100dvh; display: flex; flex-direction: column; }

.topbar {
  flex: none; display: flex; align-items: center; gap: 14px;
  padding: 18px 28px; font-size: 13.5px; color: var(--ink-dim);
}
.brand { display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 650; letter-spacing: -.2px; }
.brand img { width: 26px; height: 26px; border-radius: 6px; display: block; }
.topbar .sub { padding-left: 14px; border-left: 1px solid var(--line); }
.topbar .spacer { margin-left: auto; }
.topbar .local { display: flex; align-items: center; gap: 7px; }
.topbar .local::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px rgba(53, 201, 126, .6);
}
.langpill {
  display: inline-flex; padding: 3px; gap: 2px; margin-left: 6px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--bg-2);
}
.langpill button {
  font: inherit; font-size: 12.5px; font-weight: 600; line-height: 1;
  color: var(--ink-dim); background: transparent; border: 0; border-radius: 999px;
  padding: 6px 12px; cursor: pointer; transition: color .14s ease, background .14s ease;
}
.langpill button:hover { color: var(--ink); }
.langpill button.on { color: #06170e; background: var(--accent); }

.progress {
  flex: none; width: 100%; max-width: 996px; margin: 0 auto; padding: 0 28px 10px;
  display: flex; gap: 6px; flex-wrap: wrap;
}
.progress span {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12.5px; font-weight: 600; color: var(--ink-dim);
  padding: 5px 12px; border-radius: 999px; border: 1px solid transparent;
}
.progress span i {
  font-style: normal; font-family: var(--mono); font-size: 11px;
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  border: 1px solid var(--line); color: var(--ink-dim);
}
.progress span.now { color: var(--ink); background: var(--card); border-color: var(--line); }
.progress span.now i { background: var(--accent); border-color: var(--accent); color: #06170e; }
.progress span.done { color: var(--ink-mid); }
.progress span.done i { color: var(--accent); border-color: var(--accent-dim); }

.deck {
  flex: 1 1 auto; position: relative; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 0 28px;
}
.slide {
  width: 100%; max-width: 940px;
  max-height: 100%; overflow-y: auto; overscroll-behavior: contain;
  padding: 8px 4px 12px;
}
.slide [data-rise] { animation: rise .62s cubic-bezier(.16, .84, .34, 1) backwards; }
.slide [data-rise="1"] { animation-delay: .04s; }
.slide [data-rise="2"] { animation-delay: .13s; }
.slide [data-rise="3"] { animation-delay: .22s; }
.slide [data-rise="4"] { animation-delay: .31s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .slide [data-rise] { animation: none; }
  * { transition-duration: .01ms !important; }
}

.footbar {
  flex: none; display: flex; align-items: center; gap: 14px;
  padding: 16px 28px 22px; font-size: 13px; color: var(--ink-dim);
}
.dots { display: flex; gap: 7px; }
.dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--line); transition: background .18s ease, transform .18s ease;
}
.dots span.done { background: var(--accent-dim); }
.dots span.on { background: var(--accent); transform: scale(1.35); }
.footbar .spacer { margin-left: auto; }
.keyhint { display: flex; gap: 6px; align-items: center; }
kbd {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-mid);
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 6px; background: var(--bg-2);
}

/* ---------- 文字 ---------- */

.kicker {
  margin: 0 0 12px; font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--accent);
}
h2 {
  margin: 0 0 12px; font-size: clamp(26px, 3.9vw, 40px); line-height: 1.14;
  letter-spacing: -1px; font-weight: 700;
}
.lead {
  margin: 0 0 18px; font-size: clamp(16px, 1.5vw, 19px);
  color: var(--ink-mid); text-wrap: pretty;
}
.lead b, .close b, .row b, .pipeline b, .note b { color: var(--ink); font-weight: 650; }
.close { margin: 16px 0 0; font-size: 14.5px; color: var(--ink-mid); }
.note { margin: 10px 0 0; font-size: 13px; color: var(--ink-dim); }
.sect { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); }
.block { margin-top: 16px; }
.empty { text-align: center; color: var(--ink-mid); font-size: 17px; }
.empty .mono { color: var(--accent); }

/* ---------- 按钮 ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-size: 15px; font-weight: 620;
  padding: 12px 24px; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  transition: transform .14s ease, border-color .14s ease, filter .14s ease;
}
.btn:hover { transform: translateY(-1px); border-color: var(--ink-dim); }
.btn-primary { background: var(--accent); border-color: transparent; color: #06170e; }
.btn-primary:hover { filter: brightness(1.07); border-color: transparent; }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 22px; }
.btn-text {
  font: inherit; font-size: 14px; color: var(--ink-dim); background: none;
  border: 0; cursor: pointer; padding: 6px 2px;
}
.btn-text:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.btn-row .hint { margin-left: auto; font-size: 13px; color: var(--ink-dim); }

/* ---------- 清单行(命令行、软件、开关共用) ---------- */

.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px; border: 1px solid var(--line-soft); border-radius: 14px;
  background: linear-gradient(180deg, var(--card), rgba(16, 21, 29, .35));
}
.row.off { opacity: .55; }
.row .nm { font-size: 15px; font-weight: 650; color: var(--ink); flex: 0 0 auto; min-width: 120px; max-width: 230px; }
.row .what { flex: 1 1 auto; font-size: 13.5px; color: var(--ink-mid); line-height: 1.5; }
.row .what small { display: block; color: var(--ink-dim); font-size: 12.5px; }
.row.off .nm { color: var(--ink-mid); font-weight: 500; }

/* 勾选:整行是一个大的可点区域,选中态用整块卡片说话,不靠某一条边。 */
.row.pick { cursor: pointer; user-select: none; transition: border-color .14s ease, background .14s ease; }
.row.pick:hover { border-color: var(--line); }
.row.pick.on { border-color: var(--accent-dim); background: linear-gradient(180deg, rgba(53, 201, 126, .10), rgba(53, 201, 126, .04)); }
.row.pick.lock { cursor: default; }
.box {
  flex: none; width: 20px; height: 20px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg-2);
  display: grid; place-items: center; font-size: 13px; color: transparent;
  transition: background .14s ease, border-color .14s ease;
}
.row.on .box { background: var(--accent); border-color: var(--accent); color: #06170e; }
.row.lock .box { opacity: .6; }
.tag {
  flex: none; font-size: 11.5px; font-weight: 700; letter-spacing: .3px;
  color: var(--warm); border: 1px solid rgba(240, 180, 41, .35); border-radius: 999px; padding: 2px 9px;
}
.tag.good { color: var(--accent); border-color: var(--accent-dim); }

/* ---------- 第 1 屏:会动哪些地方 ---------- */

.places { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.place { padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--card); }
.place .k { font-size: 12px; color: var(--ink-dim); margin-bottom: 4px; }
.place .v { font-family: var(--mono); font-size: 13px; color: var(--ink); word-break: break-all; }
.place .d { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; line-height: 1.45; }

/* ---------- 第 4 屏:轻量 ai ---------- */

.twocol { display: grid; grid-template-columns: 1fr 1.05fr; gap: 14px; align-items: start; }
@media (max-width: 820px) { .twocol { grid-template-columns: 1fr; } }
.panel { padding: 16px 18px; border: 1px solid var(--line-soft); border-radius: 14px; background: var(--card); }
.tile { display: flex; gap: 18px; align-items: center; margin-top: 12px; padding: 14px 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg-2); }
.tile .num { flex: none; font-family: var(--mono); font-size: clamp(26px, 3.4vw, 36px); line-height: 1; font-weight: 600; letter-spacing: -1.5px; color: var(--ink); }
.tile .num small { display: block; font-size: 11.5px; letter-spacing: 0; font-weight: 500; color: var(--ink-dim); margin-top: 5px; }
.tile .txt { font-size: 13.5px; line-height: 1.55; color: var(--ink-mid); }
.pipeline { list-style: none; margin: 0; padding: 0; }
.pipeline li { display: flex; gap: 12px; align-items: flex-start; padding: 7px 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-mid); border-top: 1px solid var(--line-soft); }
.pipeline li:first-child { border-top: 0; padding-top: 0; }
.pipeline .mono { color: var(--ink); font-size: 12.5px; }
.pipeline .n { flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 1px; display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--accent); border: 1px solid var(--accent-dim); }

label { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .6px; color: var(--ink-dim); margin: 10px 0 5px; }
label:first-child { margin-top: 0; }
input, select {
  width: 100%; font: inherit; font-size: 14.5px; line-height: 1.4;
  color: var(--ink); background: var(--bg-2);
  border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px;
}
input { font-family: var(--mono); font-size: 13.5px; }
input::placeholder { color: var(--ink-dim); }
input:focus, select:focus { border-color: var(--accent-dim); outline: none; }
select { appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
select option { background: var(--bg-2); color: var(--ink); }
.pair { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
.keybox { position: relative; }
.keybox input { padding-right: 64px; }
.keybox .eye {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-dim);
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; cursor: pointer;
}
.keybox .eye:hover { color: var(--ink); border-color: var(--ink-dim); }
.preview {
  margin: 8px 0 0; padding: 10px 12px; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; line-height: 1.45; color: var(--ink-mid);
  white-space: pre-wrap; word-break: break-all;
}
.preview .k { color: var(--ink-dim); }
.preview .s { color: var(--accent); }
.preview .masked { color: var(--warm); }

/* ---------- 第 5 屏:汇总与交接 ---------- */

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.sum { padding: 13px 15px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--card); }
.sum .k { font-size: 11.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
.sum .v { font-size: 13px; color: var(--ink); line-height: 1.45; }
.sum .v.dim { color: var(--ink-dim); }
.sum .v small { color: var(--ink-dim); }

.term-win { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #10151d; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); }
.term-bar { position: relative; height: 34px; display: flex; align-items: center; justify-content: center; background: #161b23; border-bottom: 1px solid #1f2632; font-size: 12px; color: var(--ink-dim); }
.term-bar .traffic { position: absolute; left: 12px; display: flex; gap: 8px; }
.term-bar .tl { width: 11px; height: 11px; border-radius: 50%; background: rgba(255,255,255,.22); }
.term-bar .tl:first-child { background: #e8a33d; box-shadow: 0 0 6px rgba(232,163,61,.55); }
.term-screen { display: flex; align-items: center; gap: 14px; padding: 16px; font-family: "SF Mono", Menlo, Monaco, "Courier New", monospace; font-size: 14px; line-height: 1.35; color: #d8dee9; }
.term-screen .p { color: var(--accent); }
.term-screen .v { flex: 1 1 auto; word-break: break-all; }
.term-screen .copy { flex: none; font: inherit; font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; cursor: pointer; }
.term-screen .copy:hover { color: var(--accent); border-color: var(--accent-dim); }
.ok { display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px solid rgba(53, 201, 126, .28); margin-top: 14px; }
.ok .tick { color: var(--accent); font-weight: 700; }
.ok .text { font-size: 14.5px; color: var(--ink); }
.ok .text .mono { color: var(--ink-mid); font-size: 13px; }
.keyrow { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.ok-inline { font-size: 14px; color: var(--ink); }
.ok-inline .tick { color: var(--accent); font-weight: 700; }
.term-bar .copy.bar { position: absolute; right: 10px; top: 5px; font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-dim); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; }
.term-bar .copy.bar:hover { color: var(--accent); border-color: var(--accent-dim); }
textarea.cfg { display: block; width: 100%; min-height: 150px; max-height: 260px; resize: vertical; margin: 0; padding: 12px 16px; border: 0; outline: none;
  background: #10151d; color: #d8dee9; font-family: "SF Mono", Menlo, Monaco, "Courier New", monospace; font-size: 12.5px; line-height: 1.4; }
body.h-compact textarea.cfg { min-height: 120px; max-height: 190px; }
body.h-tight textarea.cfg { min-height: 100px; max-height: 150px; font-size: 12px; }
body.h-tight .keyrow { margin-top: 10px; }
body.h-tight .summary { gap: 8px; }
body.h-tight .sum { padding: 10px 13px; }

/* ---------- 矮屏 ---------- */

body.h-compact .topbar { padding: 12px 28px; }
body.h-compact .footbar { padding: 10px 28px 14px; }
body.h-compact h2 { font-size: clamp(24px, 3vw, 32px); margin-bottom: 8px; }
body.h-compact .kicker { margin-bottom: 8px; }
body.h-compact .lead { margin-bottom: 14px; font-size: 15.5px; }
body.h-compact .rows { gap: 4px; }
body.h-compact .row { padding: 6px 16px; }
body.h-compact .row .what { line-height: 1.4; }
body.h-compact .row .what small { font-size: 12px; }
body.h-compact .sect { margin-bottom: 4px; }
body.h-compact .lead { margin-bottom: 10px; }
body.h-compact .kicker { margin-bottom: 6px; }
body.h-compact h2 { margin-bottom: 6px; }
body.h-compact .btn-row { margin-top: 14px; }
body.h-compact .btn { padding: 10px 20px; font-size: 14.5px; }
body.h-compact .panel { padding: 13px 15px; }
body.h-compact .block { margin-top: 10px; }

/* 再矮一档(800 像素以下):继续压留白和字号,不压内容。 */
body.h-tight .topbar { padding: 9px 28px; }
body.h-tight .progress { padding-bottom: 6px; }
body.h-tight .footbar { padding: 8px 28px 10px; }
body.h-tight h2 { font-size: clamp(22px, 2.6vw, 28px); margin-bottom: 5px; }
body.h-tight .lead { font-size: 14.5px; margin-bottom: 8px; }
body.h-tight .row { padding: 5px 14px; }
body.h-tight .row .nm { font-size: 14px; }
body.h-tight .row .what { font-size: 13px; }
body.h-tight .panel { padding: 11px 13px; }
body.h-tight .pipeline li { padding: 5px 0; font-size: 13px; line-height: 1.45; }
body.h-tight input, body.h-tight select { padding: 7px 11px; }
body.h-tight .preview { font-size: 11.5px; }
body.h-tight .btn-row { margin-top: 10px; }
body.h-tight .sect { margin-bottom: 3px; }
body.h-tight .places { gap: 8px; }
body.h-tight .place { padding: 10px 13px; }

.slide { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .16) transparent; }
.slide::-webkit-scrollbar { width: 10px; }
.slide::-webkit-scrollbar-track { background: transparent; }
.slide::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 999px; border: 3px solid transparent; background-clip: padding-box; }
[hidden] { display: none !important; }
</style>
</head>

<body>

// 服务商:DeepSeek 首选,OpenRouter 走 custom 端点;别家在「其他」里填端点即可。
const VENDORS = {
  deepseek:   { type:"deepseek", url:"https://api.deepseek.com",     model:"deepseek-v4-flash" },
  openrouter: { type:"custom",   url:"https://openrouter.ai/api/v1", model:"qwen/qwen3.7-flash" },
  custom:     { type:"custom",   url:"",                             model:"" },
};

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* ───────── 语言:浏览器说什么就默认什么,人点过就记住 ───────── */
const LANG_KEY = "frago-setup-lang";
let LANG = "en";
try { LANG = localStorage.getItem(LANG_KEY) || (String(navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"); } catch (_) {
  LANG = String(navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
}
let T = TEXT[LANG];

// 模板没被 skill 填过,就什么都不显示——没生成的模板不可能冒充某台机器。
if (!PROBE) {
  el("progress").hidden = true; el("dots").hidden = true;
  document.querySelector(".langpill").hidden = true;
  el("slide").innerHTML = `<p class="empty">${T.notGenerated}</p>`;
  throw new Error("template not generated");
}

const IS_WIN = PROBE.os === "windows";
const IN_WSL = PROBE.os === "linux" && PROBE.wsl === "distro";
const PATHS = IS_WIN
  ? { src:"%USERPROFILE%\\frago", bin:"%USERPROFILE%\\.local\\bin\\frago", data:"%USERPROFILE%\\.frago", dl:"%USERPROFILE%\\Downloads\\frago-setup-key.json" }
  : { src:"~/frago", bin:"~/.local/bin/frago", data:"~/.frago", dl:"~/Downloads/frago-setup-key.json" };

const AGENTS = PROBE.agents || [];
const TOOLS  = PROBE.tools || [];
const RUNNING = AGENTS.find(a => a.id === PROBE.running) || null;
const found = AGENTS.filter(a => a.ok);
const missingRequired = TOOLS.filter(t => t.required && !t.ok);
const howOf = x => (LANG === "en" ? (x.how_en || x.how) : (x.how || x.how_en)) || "";
const infoOf = t => T.tools[t.id] || { what: t.name, lose: "" };
const runName = () => RUNNING ? RUNNING.name : T.agentFallback;

// 用户的决定全部落在这里,最后整份写进文件。
const CHOICE = {
  connect: new Set(found.map(a => a.id)),      // 接上哪些已装的命令行(正在跑的那个不可取消)
  install_agents: new Set(),                   // 勾了「装上并接入」的命令行
  install: new Set(missingRequired.map(t => t.id)),
  keep_server: true,
  backup: false,
  windows_target: "native",   // 只在原生 Windows 上出现:"native" 或 "wsl"
  lightagent: null,           // null = 还没决定;false = 先不配;对象 = 填了
};
const hasLA = () => CHOICE.lightagent && typeof CHOICE.lightagent === "object";

function pickRow(o) {
  // 一行一个开关。整行可点;lock 的不可改。
  return `<div class="row pick ${o.on ? "on" : ""} ${o.lock ? "lock" : ""}" data-pick="${esc(o.key)}" role="checkbox" aria-checked="${o.on}" tabindex="0">` +
    `<span class="box">✓</span><span class="nm">${esc(o.name)}</span>` +
    `<span class="what">${o.what}${o.sub ? `<small>${o.sub}</small>` : ""}</span>` +
    (o.tag ? `<span class="tag ${o.tagCls || ""}">${esc(o.tag)}</span>` : "") + `</div>`;
}
function plainRow(name, what, sub, tag, tagCls, off) {
  return `<div class="row ${off ? "off" : ""}"><span class="box" style="visibility:hidden"></span><span class="nm">${esc(name)}</span>` +
    `<span class="what">${what}${sub ? `<small>${sub}</small>` : ""}</span>` +
    (tag ? `<span class="tag ${tagCls || ""}">${esc(tag)}</span>` : "") + `</div>`;
}

const steps = [
  // ── 1 这是什么 ──
  { nav: () => T.s1.nav, title: () => T.s1.title, hint: () => T.s1.hint,
    html() { return `
      <p class="lead" data-rise="2">${T.s1.lead(esc(runName()))}</p>
      <p class="sect" data-rise="3">${T.s1.sect}</p>
      <div class="places" data-rise="3">${T.s1.places(PATHS).map(([k, v, d]) =>
        `<div class="place"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join("")}</div>
      <p class="close" data-rise="4">${T.s1.close}</p>`; } },

  // ── 2 接上哪些命令行 ──
  { nav: () => T.s2.nav, title: () => T.s2.title, hint: () => T.s2.hint,
    html() {
      const s = T.s2;
      const rows = AGENTS.map(a => {
        if (a.ok && RUNNING && a.id === RUNNING.id)
          return pickRow({ key:"connect:" + a.id, on:true, lock:true, name:a.name, tag:s.running, tagCls:"good", what:s.runningWhat, sub:s.hook });
        if (a.ok)
          return pickRow({ key:"connect:" + a.id, on: CHOICE.connect.has(a.id), name:a.name, tag:s.have, tagCls:"good", what:s.hook });
        if (!a.manual)
          return pickRow({ key:"agent:" + a.id, on: CHOICE.install_agents.has(a.id), name:a.name, tag:s.missing, what:s.installWhat, sub:s.installSub(esc(howOf(a))) });
        return plainRow(a.name, s.manualWhat, s.manualSub(esc(howOf(a))), s.missing, "", true);
      }).join("");
      return `
      <p class="lead" data-rise="2">${s.lead} ${found.length ? s.introSome(found.length) : s.introNone}</p>
      <div class="rows" data-rise="3">${rows}</div>
      <p class="note" data-rise="4">${s.note}</p>`; } },

  // ── 3 要装什么 ──
  { nav: () => T.s3.nav, title: () => T.s3.title, hint: () => T.s3.hint,
    html() {
      const s = T.s3;
      // Windows 上多一个岔口:装原生还是装 WSL。有 WSL 才给两个选项,没有就只推原生。
      // agent 自己跑在 WSL 里时(PROBE.os 是 linux)不出现这个岔口,给一句说明代替。
      const whereBlock = () => {
        if (!IS_WIN) {
          return IN_WSL ? `<p class="note" data-rise="2">${s.inWsl}</p>` : "";
        }
        if (PROBE.wsl !== "distro") {
          return `
            <p class="sect block" data-rise="2">${s.sectWhere}</p>
            <p class="note" data-rise="2">${s.whereLeadNo}</p>
            <div class="rows" data-rise="2">${pickRow({ key:"windows_target:native", on:true, lock:true, name:s.optNative, what:s.optNativeWhat, tag:s.rec, tagCls:"good" })}</div>`;
        }
        return `
          <p class="sect block" data-rise="2">${s.sectWhere}</p>
          <p class="note" data-rise="2">${s.whereLead}</p>
          <div class="rows" data-rise="2">
            ${pickRow({ key:"windows_target:native", on: CHOICE.windows_target === "native", name:s.optNative, what:s.optNativeWhat, tag:s.rec, tagCls:"good" })}
            ${pickRow({ key:"windows_target:wsl", on: CHOICE.windows_target === "wsl", name:s.optWsl, what:s.optWslWhat })}
          </div>`;
      };
      // 软件永远逐行列出,版式不随机器变;装没装只改每一行的状态。
      const rows = TOOLS.map(t => {
        const info = infoOf(t), how = esc(howOf(t));
        if (t.ok) return plainRow(t.name, esc(info.what), "", s.have, "good");
        if (t.required) return pickRow({ key:"install:" + t.id, on:true, lock:true, name:t.name, what:esc(info.what), sub: how ? s.howSub(how) : "", tag:s.required });
        return pickRow({ key:"install:" + t.id, on: CHOICE.install.has(t.id), lock: t.id === "gh" && CHOICE.backup,
          name:t.name, what:esc(info.what), sub:s.loseSub(esc(info.lose), how), tag:s.missing });
      }).join("");
      return `
      <p class="lead" data-rise="2">${s.lead}</p>
      ${whereBlock()}
      <p class="sect" data-rise="3">${s.sectTools}</p>
      <div class="rows" data-rise="3">${rows}</div>
      <p class="sect block" data-rise="4">${s.sectAfter}</p>
      <div class="rows" data-rise="4">
        ${pickRow({ key:"keep_server", on:CHOICE.keep_server, name:s.keepServer, what:s.keepServerWhat })}
        ${pickRow({ key:"backup", on:CHOICE.backup, name:s.backup, what:s.backupWhat, sub:s.backupSub })}
      </div>`; } },

  // ── 4 轻量 ai ──
  { nav: () => T.s4.nav, title: () => T.s4.title, hint: () => T.s4.hint,
    html() {
      const s = T.s4;
      const la = hasLA() ? CHOICE.lightagent : null;
      const v = la ? la.vendor : "deepseek";
      return `
      <p class="lead" data-rise="2">${s.lead}</p>
      <div class="twocol" data-rise="3">
        <div class="panel">
          <p class="sect">${s.sect}</p>
          <ol class="pipeline">
            <li><span class="n">1</span><span>${s.p1}</span></li>
            <li><span class="n">2</span><span>${s.p2(esc(PATHS.dl))}</span></li>
            <li><span class="n">3</span><span>${s.p3}</span></li>
            <li><span class="n">4</span><span>${s.cost}</span></li>
          </ol>
        </div>
        <div class="panel">
          <label for="vendor">${s.vendor}</label>
          <select id="vendor">
            <option value="deepseek" ${v === "deepseek" ? "selected" : ""}>${s.vendorRec}</option>
            <option value="openrouter" ${v === "openrouter" ? "selected" : ""}>OpenRouter</option>
            <option value="custom" ${v === "custom" ? "selected" : ""}>${s.vendorOther}</option>
          </select>
          <label for="key">${s.key}</label>
          <div class="keybox">
            <input id="key" type="password" placeholder="sk-························" autocomplete="off" spellcheck="false" value="${esc(la ? la.api_key : "")}">
            <button type="button" class="eye" id="eye">${s.show}</button>
          </div>
          <div class="pair">
            <div><label for="url">${s.url}</label><input id="url" value="${esc(la ? la.url : VENDORS.deepseek.url)}" spellcheck="false"></div>
            <div><label for="model">${s.model}</label><input id="model" value="${esc(la ? la.model : VENDORS.deepseek.model)}" spellcheck="false"></div>
          </div>
          <label style="margin-top:12px">${s.preview}</label>
          <pre class="preview" id="preview"></pre>
        </div>
      </div>`; },
    buttons() { return `<button class="btn btn-primary" id="go">${T.s4.done}</button><button class="btn" id="skipla">${T.s4.skip}</button>`; } },

  // ── 5 交给 agent ──
  { nav: () => T.s5.nav, title: () => T.s5.title, hint: () => T.s5.hint,
    html() {
      const s = T.s5;
      const nameOf = (list, ids) => list.filter(x => ids.has(x.id)).map(x => x.name);
      const connect = nameOf(found, CHOICE.connect);
      const notConnect = found.filter(a => !CHOICE.connect.has(a.id)).map(a => a.name);
      const newAgents = nameOf(AGENTS, CHOICE.install_agents);
      const inst = TOOLS.filter(t => !t.ok && CHOICE.install.has(t.id)).map(t => t.name);
      const skip = TOOLS.filter(t => !t.ok && !CHOICE.install.has(t.id));
      const sep = LANG === "zh" ? "、" : ", ";
      const sum = (k, v, dim) => `<div class="sum"><div class="k">${k}</div><div class="v ${dim ? "dim" : ""}">${v}</div></div>`;
      const withKey = hasLA();
      return `
      <p class="lead" data-rise="2">${s.lead(esc(runName()))} ${withKey ? s.leadKey : ""}</p>
      <div class="summary" data-rise="3">
        ${IS_WIN ? sum(s.where, CHOICE.windows_target === "wsl" ? esc(T.s3.optWsl) : esc(T.s3.optNative)) : ""}
        ${sum(s.connect, connect.length ? esc(connect.join(sep)) : s.none, !connect.length)}
        ${notConnect.length ? sum(s.notConnect, esc(notConnect.join(sep)), true) : ""}
        ${newAgents.length ? sum(s.newAgents, esc(newAgents.join(sep)) + ` <small>· ${s.newAgentsNote}</small>`) : ""}
        ${sum(s.software, inst.length ? esc(inst.join(sep)) : s.noSoftware, !inst.length)}
        ${skip.length ? sum(s.skip, esc(skip.map(t => t.name).join(sep)), true) : ""}
        ${sum(s.la, hasLA() ? s.laSet(esc(CHOICE.lightagent.vendor), esc(CHOICE.lightagent.model)) : s.laSkip, !hasLA())}
        ${sum(s.after, `${CHOICE.keep_server ? s.keep : s.stop}<br>${CHOICE.backup ? s.backupYes : s.backupNo}`)}
      </div>
      ${withKey ? `<div class="keyrow" data-rise="4">
        <button class="btn btn-primary" id="savekey">${keySaved ? s.saveAgain : s.saveKey}</button>
        <span class="ok-inline" id="keyok" ${keySaved ? "" : "hidden"}><span class="tick">✓</span> ${s.savedKey}</span>
      </div>
      <p class="note" data-rise="4" id="keynote" ${keySaved ? "" : "hidden"}>${s.savedNote(esc(PATHS.dl))}</p>` : ""}
      <p class="sect block" data-rise="4">${s.cfgTitle(withKey)}</p>
      <div class="term-win" data-rise="4">
        <div class="term-bar"><span class="traffic"><span class="tl"></span><span class="tl"></span><span class="tl"></span></span>frago-setup<button class="copy bar" id="copy">${s.copy}</button></div>
        <textarea class="cfg" id="cfg" spellcheck="false"></textarea>
      </div>`; },
    buttons() { return ``; } },
];

let i = 0;
let keySaved = false;

// 贴回对话的配置:钥匙不在里面,只写钥匙文件在哪。
function configText() {
  const la = hasLA() ? CHOICE.lightagent : null;
  const payload = {
    frago_setup: 2,
    os: PROBE.os,
    ...(IS_WIN ? { windows_target: CHOICE.windows_target } : {}),
    lang: LANG,
    running: PROBE.running || null,
    connect: found.filter(a => CHOICE.connect.has(a.id)).map(a => a.id),
    install_agents: AGENTS.filter(a => !a.ok && CHOICE.install_agents.has(a.id)).map(a => a.id),
    install: TOOLS.filter(t => !t.ok && CHOICE.install.has(t.id)).map(t => t.id),
    skip:    TOOLS.filter(t => !t.ok && !CHOICE.install.has(t.id)).map(t => t.id),
    keep_server: CHOICE.keep_server,
    backup: CHOICE.backup,
    lightagent: la ? { vendor: la.vendor, endpoint_type: la.endpoint_type, url: la.url, model: la.model, key_file: PATHS.dl } : null,
  };
  // 一键一行,数组不展开:短,agent 照样能当 JSON 读
  return "{\n" + Object.entries(payload).map(([k, v]) => `  ${JSON.stringify(k)}: ${JSON.stringify(v)}`).join(",\n") + "\n}";
}

// 每一屏一个地址:#1 开场 … #5 交接。翻页一律改地址,画面是地址变化的结果,
// 于是刷新停在原处、浏览器后退能回上一屏、agent 也能直接把人送到某一屏。
function fromHash() {
  const m = (location.hash || "").match(/^#(\d+)$/);
  if (!m) return 0;
  const n = Number(m[1]) - 1;
  return n >= 0 && n < steps.length ? n : 0;
}
function go(n) {
  n = Math.max(0, Math.min(steps.length - 1, n));
  const want = "#" + (n + 1);
  if (location.hash === want) { i = n; render(); return; }
  location.hash = want;                       // hashchange 负责画
}
window.addEventListener("hashchange", () => { i = fromHash(); render(); });

function render() {
  T = TEXT[LANG];
  document.documentElement.lang = LANG;
  document.title = T.title;
  el("topsub").textContent = T.topsub;
  el("toplocal").textContent = T.toplocal;
  el("keyhint").textContent = T.keyhint;
  document.querySelectorAll(".langpill button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));

  el("progress").innerHTML = steps.map((s, n) =>
    `<span class="${n === i ? "now" : n < i ? "done" : ""}"><i>${n < i ? "✓" : n + 1}</i>${s.nav()}</span>`).join("");
  el("dots").innerHTML = steps.map((_, n) => `<span class="${n === i ? "on" : n < i ? "done" : ""}"></span>`).join("");

  const s = steps[i];
  const buttons = s.buttons ? s.buttons() : `<button class="btn btn-primary" id="go">${T.next}</button>`;
  el("slide").innerHTML =
    `<p class="kicker" data-rise="1">${T.stepOf(i + 1, steps.length)}</p>` +
    `<h2 data-rise="1">${s.title()}</h2>` + s.html() +
    `<div class="btn-row" data-rise="4">${buttons}` +
      (i > 0 ? `<button class="btn-text" id="bk">${T.back}</button>` : "") +
      `<span class="hint">${s.hint()}</span></div>`;
  el("slide").scrollTop = 0;

  const goBtn = el("go"); if (goBtn) goBtn.onclick = advance;
  const bk = el("bk"); if (bk) bk.onclick = back;

  document.querySelectorAll("[data-pick]").forEach(row => {
    const toggle = () => { if (row.classList.contains("lock")) return; pick(row.dataset.pick); };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); toggle(); } });
  });

  if (i === 3) {
    el("vendor").onchange = () => { const v = VENDORS[el("vendor").value]; el("url").value = v.url; el("model").value = v.model; preview(); };
    ["key", "url", "model"].forEach(id => el(id).addEventListener("input", preview));
    el("eye").onclick = () => { const k = el("key"), show = k.type === "password"; k.type = show ? "text" : "password"; el("eye").textContent = show ? T.s4.hide : T.s4.show; };
    el("skipla").onclick = () => { CHOICE.lightagent = false; go(i + 1); };
    preview();
  }
  if (i === 4) {
    el("cfg").value = configText();
    const sk = el("savekey"); if (sk) sk.onclick = saveKey;
    el("copy").onclick = async () => {
      const text = el("cfg").value, b = el("copy");
      try { await navigator.clipboard.writeText(text); } catch (_) {
        const t = document.createElement("textarea"); t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select(); try { document.execCommand("copy"); } finally { t.remove(); }
      }
      b.textContent = T.s5.copied; setTimeout(() => { b.textContent = T.s5.copy; }, 1600);
    };
  }
}

function pick(key) {
  const [kind, id] = key.split(":");
  const flip = (set, v) => set.has(v) ? set.delete(v) : set.add(v);
  if (kind === "connect") flip(CHOICE.connect, id);
  else if (kind === "agent") flip(CHOICE.install_agents, id);
  else if (kind === "install") flip(CHOICE.install, id);
  else if (kind === "windows_target") CHOICE.windows_target = id;
  else if (key === "keep_server") CHOICE.keep_server = !CHOICE.keep_server;
  else if (key === "backup") {
    CHOICE.backup = !CHOICE.backup;
    // 要备份就得有 gh:没装的话连带勾上并锁住;取消备份时放开。
    const gh = TOOLS.find(t => t.id === "gh");
    if (gh && !gh.ok) CHOICE.backup ? CHOICE.install.add("gh") : CHOICE.install.delete("gh");
  }
  syncPicks();
}

// 勾选只翻状态,不重画整屏——重画会让入场动画再跑一遍,看起来像列表刷新了。
function isOn(key) {
  const [kind, id] = key.split(":");
  if (kind === "connect") return CHOICE.connect.has(id);
  if (kind === "agent") return CHOICE.install_agents.has(id);
  if (kind === "install") return CHOICE.install.has(id);
  if (kind === "windows_target") return CHOICE.windows_target === id;
  if (key === "keep_server") return CHOICE.keep_server;
  if (key === "backup") return CHOICE.backup;
  return false;
}
function syncPicks() {
  document.querySelectorAll("[data-pick]").forEach(row => {
    const key = row.dataset.pick, on = isOn(key);
    row.classList.toggle("on", on);
    row.setAttribute("aria-checked", String(on));
    if (key === "install:gh") row.classList.toggle("lock", CHOICE.backup);
  });
}

// 预览就是将要落盘的那一段,只有钥匙打码:人看见的和写进去的是同一份。
function preview() {
  const key = el("key").value;
  const masked = key ? key.slice(0, 3) + "•".repeat(Math.max(6, Math.min(20, key.length - 3))) : T.s4.notYet;
  const line = (k, v, cls) => `  <span class="k">"${k}"</span>: <span class="${cls || "s"}">"${esc(v)}"</span>`;
  el("preview").innerHTML = "{\n" + [
    line("vendor", el("vendor").value), line("endpoint_type", VENDORS[el("vendor").value].type), line("url", el("url").value),
    line("model", el("model").value), line("api_key", masked, "masked"),
  ].join(",\n") + "\n}";
}

function advance() {
  if (i >= steps.length - 1) return;
  if (i === 3) {
    if (!el("key").value.trim()) { el("key").focus(); return; }
    CHOICE.lightagent = { vendor: el("vendor").value, endpoint_type: VENDORS[el("vendor").value].type, url: el("url").value, model: el("model").value, api_key: el("key").value };
  }
  go(i + 1);
}
function back() { if (i > 0) go(i - 1); }

// 钥匙文件:只有钥匙那几项,agent 建好 profile 就删。
function saveKey() {
  const la = CHOICE.lightagent;
  const b = new Blob([JSON.stringify({ frago_setup_key: 2, vendor: la.vendor, endpoint_type: la.endpoint_type, url: la.url, model: la.model, api_key: la.api_key }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = "frago-setup-key.json"; a.click();
  keySaved = true;
  el("savekey").textContent = T.s5.saveAgain;
  el("keyok").hidden = false; el("keynote").hidden = false;
}

document.querySelectorAll(".langpill button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem(LANG_KEY, LANG); } catch (_) { /* 隐私模式 */ }
  render();
}));

document.addEventListener("keydown", e => {
  const typing = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "SELECT");
  // 第 4 步要人明确选「填好了」还是「先不配」,方向键不替他做主;第 5 步没有下一步。
  if (e.key === "ArrowRight" && i < 3) advance();
  else if (e.key === "ArrowLeft" && !typing) back();
});

function fitTier() {
  const h = window.innerHeight;
  document.body.classList.toggle("h-compact", h <= 900);
  document.body.classList.toggle("h-tight", h <= 860);
}
window.addEventListener("resize", fitTier);
fitTier();
if (!location.hash) history.replaceState(null, "", "#1");   // 开场不留后退历史
i = fromHash();
render();
</script>
</body>
</html>
